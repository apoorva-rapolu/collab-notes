<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Real-Time Collaborative Notes</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --accent: #4f46e5;
    --text: #1f2023;
    --muted: #6b6f76;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); }
  #status.connected { color: #16a34a; }
  #status.disconnected { color: #dc2626; }
  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  #editor-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 8px;
  }
  #editor {
    flex: 1;
    resize: none;
    padding: 16px;
    font-size: 15px;
    line-height: 1.5;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
  }
  #meta { font-size: 12px; color: var(--muted); min-height: 16px; }
  #sidebar {
    width: 220px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  #presence-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  #presence-list li { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; flex-shrink: 0; }
  #typing-indicator { font-size: 12px; color: var(--accent); min-height: 16px; }
  #conflict-banner {
    display: none;
    background: #fef3c7;
    border: 1px solid #fbbf24;
    color: #92400e;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
  #join-screen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  #join-form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #join-form h1 { font-size: 18px; margin: 0 0 4px; }
  #join-form label {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #join-form input {
    font-size: 14px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
  }
  #join-form button {
    margin-top: 6px;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  #join-form button:hover { opacity: 0.92; }
  #join-error {
    font-size: 12px;
    color: #dc2626;
    min-height: 14px;
  }
  #app { display: none; height: 100vh; flex-direction: column; }
</style>
</head>
<body>

<div id="join-screen">
  <form id="join-form">
    <h1>Join a document</h1>
    <label>
      Document name
      <input type="text" id="join-doc" placeholder="e.g. meeting-notes" required />
    </label>
    <label>
      Your name
      <input type="text" id="join-name" placeholder="e.g. Apoorva" required />
    </label>
    <div id="join-error"></div>
    <button type="submit">Join</button>
  </form>
</div>

<div id="app">
  <header>
    <h1 id="doc-title">Document: ...</h1>
    <span id="status" class="disconnected">connecting…</span>
  </header>

  <main>
    <div id="editor-wrap">
      <div id="conflict-banner"></div>
      <textarea id="editor" placeholder="Start typing…" disabled></textarea>
      <div id="meta"></div>
      <div id="typing-indicator"></div>
    </div>
    <div id="sidebar">
      <div>
        <h2>Viewing now</h2>
        <ul id="presence-list"></ul>
      </div>
    </div>
  </main>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  // These start empty and only get set once the join form is submitted --
  // no more reading the username from the URL.
  let documentId = null;
  let username = null;

  const joinScreen = document.getElementById("join-screen");
  const joinForm = document.getElementById("join-form");
  const joinDocInput = document.getElementById("join-doc");
  const joinNameInput = document.getElementById("join-name");
  const joinError = document.getElementById("join-error");
  const appEl = document.getElementById("app");

  // Prefill from ?doc= if present (handy for sharing a link that already
  // points at a document), and remember the user's name across visits.
  joinDocInput.value = params.get("doc") || "demo";
  joinNameInput.value = localStorage.getItem("collabNotesUsername") || "";

  joinForm.addEventListener("submit", (e) => {
    e.preventDefault();

    const doc = joinDocInput.value.trim();
    const name = joinNameInput.value.trim();

    if (!doc || !name) {
      joinError.textContent = "Enter both a document name and your name.";
      return;
    }
    joinError.textContent = "";

    documentId = doc;
    username = name;
    localStorage.setItem("collabNotesUsername", name);

    document.getElementById(
      "doc-title"
    ).textContent = `Document: ${documentId} (as ${username})`;

    joinScreen.style.display = "none";
    appEl.style.display = "flex";

    connectWebSocket();
  });

  const editor = document.getElementById("editor");
  const statusEl = document.getElementById("status");
  const metaEl = document.getElementById("meta");
  const presenceList = document.getElementById("presence-list");
  const typingIndicator = document.getElementById("typing-indicator");
  const conflictBanner = document.getElementById("conflict-banner");

  // The version number our NEXT edit will be sent against. Refreshed
  // every time we get authoritative word from the server.
  let baseVersion = 0;

  // True while we're waiting for the server to ack an edit we sent.
  // We only ever allow ONE of our own edits in flight at a time --
  // see sendPendingEdit() below for why that matters.
  let editInFlight = false;

  // True if the textarea changed again after we sent the in-flight
  // edit -- tells us to send another one the moment its ack lands.
  let pendingSend = false;

  let suppressEcho = false;
  let typingTimeout = null;
  let editTimeout = null;

  const protocol =
    window.location.protocol === "https:" ? "wss" : "ws";

  // ---------------------------------------------------------
  // Apply a remote update to the textarea without losing the
  // user's cursor position if they currently have it focused.
  // This is a best-effort fix, not a true merge: if the remote
  // edit inserted/removed text *before* the cursor, the cursor
  // will land at a slightly different logical position. But it
  // no longer yanks the box out from under the user entirely.
  // ---------------------------------------------------------
  function applyRemoteContent(newContent) {
    const hadFocus = document.activeElement === editor;
    const { selectionStart, selectionEnd } = editor;

    suppressEcho = true;
    editor.value = newContent;
    suppressEcho = false;

    if (hadFocus) {
      const start = Math.min(selectionStart, newContent.length);
      const end = Math.min(selectionEnd, newContent.length);
      editor.setSelectionRange(start, end);
    }
  }

  // ---------------------------------------------------------
  // WebSocket connection, wrapped so we can reconnect on drop.
  // Render's proxy (and most reverse proxies) can close a
  // WebSocket that's been idle for a while, so losing the
  // connection is expected, not exceptional -- we just need to
  // come back from it instead of leaving the editor disabled.
  // ---------------------------------------------------------
  let ws;
  let reconnectDelay = 1000;
  let heartbeatInterval = null;

  function connectWebSocket() {
    ws = new WebSocket(
      `${protocol}://${window.location.host}/ws/${encodeURIComponent(
        documentId
      )}?username=${encodeURIComponent(username)}`
    );

    ws.onopen = () => {
      statusEl.textContent = "connected";
      statusEl.className = "connected";
      reconnectDelay = 1000; // reset backoff after a successful connection

      clearInterval(heartbeatInterval);
      heartbeatInterval = setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "ping" }));
        }
      }, 20000);
    };

    ws.onclose = () => {
      statusEl.textContent = "reconnecting…";
      statusEl.className = "disconnected";
      editor.disabled = true;
      clearInterval(heartbeatInterval);

      // Exponential backoff, capped at 10s, so a persistent outage
      // doesn't hammer the server with reconnect attempts.
      setTimeout(connectWebSocket, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 10000);
    };

    ws.onmessage = handleMessage;
  }

  function handleMessage(event) {
    const msg = JSON.parse(event.data);

    switch (msg.type) {

      // ---------------------------------------------------------
      // Initial document state
      // ---------------------------------------------------------
      case "init": {
        suppressEcho = true;

        editor.value = msg.content;
        editor.disabled = false;

        suppressEcho = false;

        baseVersion = msg.version;
        editInFlight = false;
        pendingSend = false;

        updateMeta(msg);
        break;
      }

      // ---------------------------------------------------------
      // Document update
      // ---------------------------------------------------------
      case "update": {

        const isOwnUpdate = msg.updated_by === username;

        if (isOwnUpdate) {
          /*
           * The ack for the edit we just sent. Since we only ever
           * have ONE of our own edits in flight at a time, this ack
           * can never be "stale" relative to something newer we
           * already sent -- so we never touch the textarea here, we
           * just record that we're clear to send again.
           */
          editInFlight = false;
          baseVersion = msg.version;

          if (pendingSend) {
            // The user kept typing while this edit was in flight --
            // send the latest content now, against the version we
            // just confirmed.
            sendPendingEdit();
          }

          updateMeta(msg);
          break;
        }

        /*
         * Update from another user.
         */
        if (!editInFlight) {
          // No local edit outstanding -- safe to apply directly.
          applyRemoteContent(msg.content);
          baseVersion = msg.version;
        }
        /*
         * Else: we have a local edit in flight. Don't touch the
         * textarea -- our own edit will overwrite this the moment
         * it's acked (that's LWW), and applying this intermediate
         * state now would just flicker. If our in-flight edit's
         * base_version turns out to be behind this one, the server
         * will correctly flag it as a genuine conflict.
         */

        updateMeta(msg);
        break;
      }

      // ---------------------------------------------------------
      // Presence
      // ---------------------------------------------------------
      case "presence": {
        presenceList.innerHTML = "";

        msg.users.forEach((u) => {
          const li = document.createElement("li");

          li.innerHTML =
            `<span class="dot"></span>` +
            `${u}${u === username ? " (you)" : ""}`;

          presenceList.appendChild(li);
        });

        break;
      }

      // ---------------------------------------------------------
      // Typing indicator
      // ---------------------------------------------------------
      case "typing": {
        typingIndicator.textContent =
          `${msg.username} is typing…`;

        clearTimeout(typingTimeout);

        typingTimeout = setTimeout(() => {
          typingIndicator.textContent = "";
        }, 1500);

        break;
      }

      // ---------------------------------------------------------
      // LWW conflict notification
      // ---------------------------------------------------------
      case "conflict_notice": {
        conflictBanner.textContent =
          "⚠ " + msg.message;

        conflictBanner.style.display = "block";

        setTimeout(() => {
          conflictBanner.style.display = "none";
        }, 4000);

        break;
      }

      case "user_joined":
      case "user_left": {
        console.log(msg.type, msg.username);
        break;
      }

      case "pong":
        // Heartbeat reply -- nothing to do, its purpose is just to have
        // kept the connection active.
        break;
    }
  }

  function updateMeta(msg) {
    metaEl.textContent =
      `v${msg.version}` +
      `${msg.updated_by
        ? " · last edit by " + msg.updated_by
        : ""}`;
  }

  // ---------------------------------------------------------
  // Send the current textarea content, but only if nothing is
  // already in flight. If something IS in flight, just remember
  // we owe the server a fresher edit -- the "update" handler
  // above calls this again the instant the in-flight ack lands.
  // ---------------------------------------------------------
  function sendPendingEdit() {
    if (ws.readyState !== WebSocket.OPEN) return;

    if (editInFlight) {
      pendingSend = true;
      return;
    }

    editInFlight = true;
    pendingSend = false;

    ws.send(
      JSON.stringify({
        type: "edit",
        content: editor.value,
        base_version: baseVersion
      })
    );
  }

  editor.addEventListener("input", () => {
    if (suppressEcho) return;

    // Tell other users that we are typing.
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "typing" }));
    }

    clearTimeout(editTimeout);

    // Wait 300ms after the user stops typing before sending -- this
    // is what turns a burst of keystrokes into a single edit.
    editTimeout = setTimeout(sendPendingEdit, 300);
  });
</script>

</body>
</html>
