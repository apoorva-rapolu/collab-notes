<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Real-Time Collaborative Notes</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --accent: #4f46e5;
    --text: #1f2023;
    --muted: #6b6f76;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); }
  #status.connected { color: #16a34a; }
  #status.disconnected { color: #dc2626; }
  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  #editor-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 8px;
  }
  #editor {
    flex: 1;
    resize: none;
    padding: 16px;
    font-size: 15px;
    line-height: 1.5;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
  }
  #meta { font-size: 12px; color: var(--muted); min-height: 16px; }
  #sidebar {
    width: 220px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  #presence-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  #presence-list li { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; flex-shrink: 0; }
  #typing-indicator { font-size: 12px; color: var(--accent); min-height: 16px; }
  #conflict-banner {
    display: none;
    background: #fef3c7;
    border: 1px solid #fbbf24;
    color: #92400e;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1 id="doc-title">Document: ...</h1>
  <span id="status" class="disconnected">connecting…</span>
</header>

<main>
  <div id="editor-wrap">
    <div id="conflict-banner"></div>
    <textarea id="editor" placeholder="Start typing…" disabled></textarea>
    <div id="meta"></div>
    <div id="typing-indicator"></div>
  </div>
  <div id="sidebar">
    <div>
      <h2>Viewing now</h2>
      <ul id="presence-list"></ul>
    </div>
  </div>
</main>

<script>
  // document_id and username come from the URL, e.g.
  //   /static/index.html?doc=meeting-notes&user=apoorva
  const params = new URLSearchParams(window.location.search);
  const documentId = params.get("doc") || "demo";
  const username = params.get("user") || ("user-" + Math.floor(Math.random() * 1000));

  document.getElementById("doc-title").textContent = `Document: ${documentId} (as ${username})`;

  const editor = document.getElementById("editor");
  const statusEl = document.getElementById("status");
  const metaEl = document.getElementById("meta");
  const presenceList = document.getElementById("presence-list");
  const typingIndicator = document.getElementById("typing-indicator");
  const conflictBanner = document.getElementById("conflict-banner");

  let baseVersion = 0;
  let suppressEcho = false; // avoid re-broadcasting edits we just received
  let typingTimeout = null;
  let editTimeout = null;

  const protocol = window.location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(
    `${protocol}://${window.location.host}/ws/${encodeURIComponent(documentId)}?username=${encodeURIComponent(username)}`
  );

  ws.onopen = () => {
    statusEl.textContent = "connected";
    statusEl.className = "connected";
  };

  ws.onclose = () => {
    statusEl.textContent = "disconnected";
    statusEl.className = "disconnected";
    editor.disabled = true;
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    switch (msg.type) {
      case "init": {
        suppressEcho = true;
        editor.value = msg.content;
        editor.disabled = false;
        suppressEcho = false;
        baseVersion = msg.version;
        updateMeta(msg);
        break;
      }
      case "update": {
        // Another client's edit (or the server's ack of our own edit).
        if (document.activeElement !== editor || msg.updated_by === username) {
          suppressEcho = true;
          editor.value = msg.content;
          suppressEcho = false;
        }
        baseVersion = msg.version;
        updateMeta(msg);
        break;
      }
      case "presence": {
        presenceList.innerHTML = "";
        msg.users.forEach((u) => {
          const li = document.createElement("li");
          li.innerHTML = `<span class="dot"></span>${u}${u === username ? " (you)" : ""}`;
          presenceList.appendChild(li);
        });
        break;
      }
      case "typing": {
        typingIndicator.textContent = `${msg.username} is typing…`;
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => (typingIndicator.textContent = ""), 1500);
        break;
      }
      case "conflict_notice": {
        conflictBanner.textContent = "⚠ " + msg.message;
        conflictBanner.style.display = "block";
        setTimeout(() => (conflictBanner.style.display = "none"), 4000);
        break;
      }
      case "user_joined":
      case "user_left":
        // presence list message already keeps the sidebar accurate;
        // this is just useful for console debugging.
        console.log(msg.type, msg.username);
        break;
    }
  };

  function updateMeta(msg) {
    const when = msg.updated_at ? new Date(msg.updated_at).toLocaleTimeString() : "";
    metaEl.textContent = `v${msg.version}${msg.updated_by ? " · last edit by " + msg.updated_by : ""}`;
  }

  editor.addEventListener("input", () => {
    if (suppressEcho) return;

    // Notify others someone is typing (throttled implicitly by debounce below).
    ws.send(JSON.stringify({ type: "typing" }));

    clearTimeout(editTimeout);
    editTimeout = setTimeout(() => {
      ws.send(
        JSON.stringify({
          type: "edit",
          content: editor.value,
          base_version: baseVersion,
        })
      );
    }, 300); // debounce so we don't send an edit on every keystroke
  });
</script>

</body>
</html>
