<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Real-Time Collaborative Notes</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --accent: #4f46e5;
    --text: #1f2023;
    --muted: #6b6f76;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); }
  #status.connected { color: #16a34a; }
  #status.disconnected { color: #dc2626; }
  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  #editor-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 8px;
  }
  #editor {
    flex: 1;
    resize: none;
    padding: 16px;
    font-size: 15px;
    line-height: 1.5;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
  }
  #meta { font-size: 12px; color: var(--muted); min-height: 16px; }
  #sidebar {
    width: 220px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  #presence-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  #presence-list li { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; flex-shrink: 0; }
  #typing-indicator { font-size: 12px; color: var(--accent); min-height: 16px; }
  #conflict-banner {
    display: none;
    background: #fef3c7;
    border: 1px solid #fbbf24;
    color: #92400e;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1 id="doc-title">Document: ...</h1>
  <span id="status" class="disconnected">connecting…</span>
</header>

<main>
  <div id="editor-wrap">
    <div id="conflict-banner"></div>
    <textarea id="editor" placeholder="Start typing…" disabled></textarea>
    <div id="meta"></div>
    <div id="typing-indicator"></div>
  </div>
  <div id="sidebar">
    <div>
      <h2>Viewing now</h2>
      <ul id="presence-list"></ul>
    </div>
  </div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const documentId = params.get("doc") || "demo";
  const username =
    params.get("user") || ("user-" + Math.floor(Math.random() * 1000));

  document.getElementById(
    "doc-title"
  ).textContent = `Document: ${documentId} (as ${username})`;

  const editor = document.getElementById("editor");
  const statusEl = document.getElementById("status");
  const metaEl = document.getElementById("meta");
  const presenceList = document.getElementById("presence-list");
  const typingIndicator = document.getElementById("typing-indicator");
  const conflictBanner = document.getElementById("conflict-banner");

  // Latest version known to exist on the server.
  let serverVersion = 0;

  // Version that our current local edit started from.
  let editBaseVersion = 0;

  // Used to detect whether the user typed again after an edit was sent.
  let editGeneration = 0;
  let sentGeneration = -1;

    let suppressEcho = false;
  let typingTimeout = null;
  let editTimeout = null;

  const protocol =
    window.location.protocol === "https:" ? "wss" : "ws";

  // ---------------------------------------------------------
  // Apply a remote update to the textarea without losing the
  // user's cursor position if they currently have it focused.
  // This is a best-effort fix, not a true merge: if the remote
  // edit inserted/removed text *before* the cursor, the cursor
  // will land at a slightly different logical position. But it
  // no longer yanks the box out from under the user entirely.
  // ---------------------------------------------------------
  function applyRemoteContent(newContent) {
    const hadFocus = document.activeElement === editor;
    const { selectionStart, selectionEnd } = editor;

    suppressEcho = true;
    editor.value = newContent;
    suppressEcho = false;

    if (hadFocus) {
      const start = Math.min(selectionStart, newContent.length);
      const end = Math.min(selectionEnd, newContent.length);
      editor.setSelectionRange(start, end);
    }
  }

  // ---------------------------------------------------------
  // WebSocket connection, wrapped so we can reconnect on drop.
  // Render's proxy (and most reverse proxies) can close a
  // WebSocket that's been idle for a while, so losing the
  // connection is expected, not exceptional -- we just need to
  // come back from it instead of leaving the editor disabled.
  // ---------------------------------------------------------
  let ws;
  let reconnectDelay = 1000;
  let heartbeatInterval = null;

  function connectWebSocket() {
    ws = new WebSocket(
      `${protocol}://${window.location.host}/ws/${encodeURIComponent(
        documentId
      )}?username=${encodeURIComponent(username)}`
    );

    ws.onopen = () => {
      statusEl.textContent = "connected";
      statusEl.className = "connected";
      reconnectDelay = 1000; // reset backoff after a successful connection

      clearInterval(heartbeatInterval);
      heartbeatInterval = setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "ping" }));
        }
      }, 20000);
    };

    ws.onclose = () => {
      statusEl.textContent = "reconnecting…";
      statusEl.className = "disconnected";
      editor.disabled = true;
      clearInterval(heartbeatInterval);

      // Exponential backoff, capped at 10s, so a persistent outage
      // doesn't hammer the server with reconnect attempts.
      setTimeout(connectWebSocket, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 10000);
    };

    ws.onmessage = handleMessage;
  }

  function handleMessage(event) {
    const msg = JSON.parse(event.data);

    switch (msg.type) {

      // ---------------------------------------------------------
      // Initial document state
      // ---------------------------------------------------------
     case "init": {
  suppressEcho = true;

  editor.value = msg.content;
  editor.disabled = false;

  suppressEcho = false;

  serverVersion = msg.version;
  editBaseVersion = msg.version;

  editGeneration = 0;
  sentGeneration = 0;

  updateMeta(msg);
  break;
}

      // ---------------------------------------------------------
      // Document update
      // ---------------------------------------------------------
      case "update": {

        const isOwnUpdate = msg.updated_by === username;

        /*
         * Our own edit was accepted by the server.
         */
        if (isOwnUpdate) {

          /*
           * Only replace the editor if the user has NOT typed
           * anything new since this edit was sent.
           */
          if (sentGeneration === editGeneration) {
            suppressEcho = true;
            editor.value = msg.content;
            suppressEcho = false;

            editBaseVersion = msg.version;
          } else {
            /*
             * The user continued typing after the previous edit
             * was sent. Do NOT overwrite their newer text.
             *
             * Their next edit will be based on this accepted version.
             */
            editBaseVersion = msg.version;
          }

          serverVersion = msg.version;
          updateMeta(msg);
          break;
        }

              /*
         * Update from another user.
         */
        if (!isOwnUpdate) {

          /*
           * Apply it as long as WE don't have unsent local changes
           * pending. Being focused in the box is fine -- we preserve
           * cursor position in applyRemoteContent() -- what we must
           * not do is stomp on keystrokes the user has typed but not
           * sent yet (that's the editGeneration !== sentGeneration
           * case, handled by the "else" below).
           */
          if (editGeneration === sentGeneration) {
            applyRemoteContent(msg.content);
            editBaseVersion = msg.version;
          }
          /*
           * Else: we have unsent local edits. Leave the box alone so
           * the user isn't interrupted mid-keystroke. editBaseVersion
           * stays where it was, so our next edit will correctly be
           * flagged as a conflict against this newer version and the
           * conflict banner will explain what happened.
           */

          /*
           * Always remember the newest server version, regardless of
           * whether we applied it to the textarea just now.
           */
          serverVersion = msg.version;

          updateMeta(msg);
        }

        break;
      }

      // ---------------------------------------------------------
      // Presence
      // ---------------------------------------------------------
      case "presence": {
        presenceList.innerHTML = "";

        msg.users.forEach((u) => {
          const li = document.createElement("li");

          li.innerHTML =
            `<span class="dot"></span>` +
            `${u}${u === username ? " (you)" : ""}`;

          presenceList.appendChild(li);
        });

        break;
      }

      // ---------------------------------------------------------
      // Typing indicator
      // ---------------------------------------------------------
      case "typing": {
        typingIndicator.textContent =
          `${msg.username} is typing…`;

        clearTimeout(typingTimeout);

        typingTimeout = setTimeout(() => {
          typingIndicator.textContent = "";
        }, 1500);

        break;
      }

      // ---------------------------------------------------------
      // LWW conflict notification
      // ---------------------------------------------------------
      case "conflict_notice": {
        conflictBanner.textContent =
          "⚠ " + msg.message;

        conflictBanner.style.display = "block";

        setTimeout(() => {
          conflictBanner.style.display = "none";
        }, 4000);

        break;
      }

            case "user_joined":
      case "user_left": {
        console.log(msg.type, msg.username);
        break;
      }

      case "pong":
        // Heartbeat reply -- nothing to do, its purpose is just to have
        // kept the connection active.
        break;
    }
  }

  connectWebSocket();

  function updateMeta(msg) {
    metaEl.textContent =
      `v${msg.version}` +
      `${msg.updated_by
        ? " · last edit by " + msg.updated_by
        : ""}`;
  }

  // ---------------------------------------------------------
  // Local editing
  // ---------------------------------------------------------
  editor.addEventListener("input", () => {

    if (suppressEcho) return;

    /*
     * If this is the beginning of a new local edit,
     * remember the server version we started from.
     */
    if (editGeneration === sentGeneration) {
      editBaseVersion = serverVersion;
    }

    editGeneration++;

    // Tell other users that we are typing.
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(
        JSON.stringify({
          type: "typing"
        })
      );
    }

    clearTimeout(editTimeout);

    /*
     * Wait 300 ms before sending the edit.
     * This prevents sending one request per keystroke.
     */
    editTimeout = setTimeout(() => {

      if (ws.readyState !== WebSocket.OPEN) return;

      sentGeneration = editGeneration;

      ws.send(
        JSON.stringify({
          type: "edit",
          content: editor.value,
          base_version: editBaseVersion
        })
      );

    }, 300);
  });
</script>

</body>
</html>
